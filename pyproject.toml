[project]
name = "python-remote-desktop"
version = "0.1.0"
description = "Cross-platform, consent-based remote desktop foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15,<1.0",
    "mss>=10.0,<11.0",
    "Pillow>=11.0,<13.0",
    "rich>=13.0,<15.0",
    "av>=18.1,<19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
rdc = "rdesktop.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdesktop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
