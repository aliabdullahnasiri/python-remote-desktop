[project]
name = "python-remote-desktop"
version = "0.2.0"
description = "Cross-platform, consent-based remote desktop foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15,<1.0",
    "mss>=10.0,<11.0",
    "Pillow>=11.0,<13.0",
    "rich>=13.0,<15.0",
    "av>=18.1,<19",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "websockets>=14,<17",
    "aiortc>=1.14,<2",
    "pynput>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2",
    "pyinstaller>=6.0",
]

[project.scripts]
rdc = "rdesktop.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdesktop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pyinstaller>=6.22.3",
    "pyright>=1.1.414",
    "ruff>=0.17.4",
]
